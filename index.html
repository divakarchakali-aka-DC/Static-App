<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe - Game Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f9fc;
    }
    .nav-link {
      position: relative;
    }
    .nav-link:after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: #10b981;
      transition: width 0.3s ease;
    }
    .nav-link:hover:after {
      width: 100%;
    }
    .cell {
      width: 100px;
      height: 100px;
      font-size: 2rem;
      transition: background-color 0.3s ease;
    }
    .cell:hover {
      background-color: #f0f9ff;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Navigation -->
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
          <i class="fas fa-gamepad text-green-500 text-2xl"></i>
          <span class="text-2xl font-bold text-gray-800">Game Hub</span>
        </div>
        <div class="hidden md:flex space-x-8">
          <a href="http://localhost:3000" class="nav-link text-gray-700 hover:text-green-500 font-medium">Rock Paper Scissors</a>
          <a href="http://localhost:3001" class="nav-link text-gray-700 hover:text-green-500 font-medium">Tic Tac Toe</a>
        </div>
        <button class="md:hidden text-gray-700">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <div class="relative w-full h-[20rem] md:h-[24rem] bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/30"></div>
    <div class="relative z-10 text-center text-white px-4 max-w-4xl">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-4 drop-shadow-lg">Tic Tac Toe</h1>
      <p class="text-lg md:text-xl mb-6 font-medium">Get three in a row to win!</p>
    </div>
  </div>

  <!-- Game Section -->
  <div class="max-w-4xl mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-lg p-8 text-center">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Player <span id="current-player" class="text-green-600">X</span>'s Turn</h2>
      <div class="grid grid-cols-3 gap-2 mb-8 max-w-sm mx-auto">
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="0"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="1"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="2"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="3"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="4"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="5"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="6"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="7"></div>
        <div class="cell bg-gray-100 border-2 border-gray-300 flex items-center justify-center cursor-pointer" data-index="8"></div>
      </div>
      <p id="message" class="text-lg font-semibold mb-6 text-gray-600">-</p>
      <div class="flex justify-center gap-8 mb-6">
        <div class="text-center">
          <p class="text-lg font-semibold">X Wins</p>
          <p id="x-wins" class="text-3xl font-bold text-green-600">0</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold">O Wins</p>
          <p id="o-wins" class="text-3xl font-bold text-blue-600">0</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold">Draws</p>
          <p id="draws" class="text-3xl font-bold text-gray-600">0</p>
        </div>
      </div>
      <button id="reset" class="bg-blue-500 text-white font-semibold py-3 px-6 rounded-full shadow-lg hover:bg-blue-600 transition">Reset Game</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white pt-8 pb-4">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-gray-400">&copy; 2024 Game Hub. Built with HTML, CSS, and JS.</p>
    </div>
  </footer>

  <script>
    const cells = document.querySelectorAll('.cell');
    const message = document.getElementById('message');
    const currentPlayerDisplay = document.getElementById('current-player');
    let currentPlayer = 'X';
    let board = Array(9).fill(null);
    let gameActive = true;
    let xWins = 0, oWins = 0, draws = 0;

    const winPatterns = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function checkWinner() {
      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          gameActive = false;
          message.textContent = `Player ${board[a]} Wins!`;
          if (board[a] === 'X') xWins++;
          else oWins++;
          updateScores();
          return;
        }
      }
      if (!board.includes(null)) {
        gameActive = false;
        message.textContent = 'It\'s a Draw!';
        draws++;
        updateScores();
      }
    }

    function updateScores() {
      document.getElementById('x-wins').textContent = xWins;
      document.getElementById('o-wins').textContent = oWins;
      document.getElementById('draws').textContent = draws;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.dataset.index;
        if (!gameActive || board[index]) return;
        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        checkWinner();
        if (gameActive) {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          currentPlayerDisplay.textContent = currentPlayer;
          currentPlayerDisplay.className = currentPlayer === 'X' ? 'text-green-600' : 'text-blue-600';
        }
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      board.fill(null);
      cells.forEach(cell => cell.textContent = '');
      currentPlayer = 'X';
      currentPlayerDisplay.textContent = 'X';
      currentPlayerDisplay.className = 'text-green-600';
      message.textContent = '-';
      gameActive = true;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors - Game Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f9fc;
    }
    .nav-link {
      position: relative;
    }
    .nav-link:after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: #10b981;
      transition: width 0.3s ease;
    }
    .nav-link:hover:after {
      width: 100%;
    }
    .choice-btn:hover {
      transform: scale(1.05);
    }
    .result {
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Navigation -->
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
          <i class="fas fa-gamepad text-green-500 text-2xl"></i>
          <span class="text-2xl font-bold text-gray-800">Game Hub</span>
        </div>
        <div class="hidden md:flex space-x-8">
          <a class="nav-link text-gray-700 hover:text-green-500 font-medium">Rock Paper Scissors</a>
        </div>
        <button class="md:hidden text-gray-700">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <div class="relative w-full h-[20rem] md:h-[24rem] bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/30"></div>
    <div class="relative z-10 text-center text-white px-4 max-w-4xl">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-4 drop-shadow-lg">Rock Paper Scissors</h1>
      <p class="text-lg md:text-xl mb-6 font-medium">Challenge the computer in this classic game!</p>
    </div>
  </div>

  <!-- Game Section -->
  <div class="max-w-4xl mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-lg p-8 text-center">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Make Your Choice</h2>
      <div class="flex flex-col sm:flex-row justify-center gap-6 mb-8">
        <button id="rock" class="choice-btn bg-green-500 text-white font-semibold py-4 px-8 rounded-full shadow-lg hover:bg-green-600 transition transform duration-300">
          <i class="fas fa-hand-rock text-2xl mr-2"></i> Rock
        </button>
        <button id="paper" class="choice-btn bg-green-500 text-white font-semibold py-4 px-8 rounded-full shadow-lg hover:bg-green-600 transition transform duration-300">
          <i class="fas fa-hand-paper text-2xl mr-2"></i> Paper
        </button>
        <button id="scissors" class="choice-btn bg-green-500 text-white font-semibold py-4 px-8 rounded-full shadow-lg hover:bg-green-600 transition transform duration-300">
          <i class="fas fa-hand-scissors text-2xl mr-2"></i> Scissors
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-gray-50 p-6 rounded-lg">
          <h3 class="text-lg font-semibold mb-2">Your Choice</h3>
          <p id="user-choice" class="text-2xl text-gray-600">-</p>
        </div>
        <div class="bg-gray-50 p-6 rounded-lg">
          <h3 class="text-lg font-semibold mb-2">Computer's Choice</h3>
          <p id="computer-choice" class="text-2xl text-gray-600">-</p>
        </div>
        <div class="bg-gray-50 p-6 rounded-lg">
          <h3 class="text-lg font-semibold mb-2">Result</h3>
          <p id="result" class="text-2xl font-bold text-green-600 result">-</p>
        </div>
      </div>
      <div class="flex justify-center gap-8 mb-6">
        <div class="text-center">
          <p class="text-lg font-semibold">Wins</p>
          <p id="wins" class="text-3xl font-bold text-green-600">0</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold">Losses</p>
          <p id="losses" class="text-3xl font-bold text-red-600">0</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-semibold">Draws</p>
          <p id="draws" class="text-3xl font-bold text-gray-600">0</p>
        </div>
      </div>
      <button id="reset" class="bg-blue-500 text-white font-semibold py-3 px-6 rounded-full shadow-lg hover:bg-blue-600 transition">Reset Score</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white pt-8 pb-4">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-gray-400">&copy; 2024 Game Hub. Built with HTML, CSS, and JS.</p>
    </div>
  </footer>

  <script>
    const choices = ['rock', 'paper', 'scissors'];
    const icons = { rock: 'fas fa-hand-rock', paper: 'fas fa-hand-paper', scissors: 'fas fa-hand-scissors' };
    let wins = 0, losses = 0, draws = 0;

    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const userChoice = btn.id;
        const computerChoice = choices[Math.floor(Math.random() * 3)];
        
        document.getElementById('user-choice').innerHTML = `<i class="${icons[userChoice]} text-3xl"></i>`;
        document.getElementById('computer-choice').innerHTML = `<i class="${icons[computerChoice]} text-3xl"></i>`;
        
        let result;
        if (userChoice === computerChoice) {
          result = 'Draw!';
          draws++;
          document.getElementById('result').className = 'text-2xl font-bold text-gray-600 result';
        } else if (
          (userChoice === 'rock' && computerChoice === 'scissors') ||
          (userChoice === 'paper' && computerChoice === 'rock') ||
          (userChoice === 'scissors' && computerChoice === 'paper')
        ) {
          result = 'You Win!';
          wins++;
          document.getElementById('result').className = 'text-2xl font-bold text-green-600 result';
        } else {
          result = 'You Lose!';
          losses++;
          document.getElementById('result').className = 'text-2xl font-bold text-red-600 result';
        }
        
        document.getElementById('result').textContent = result;
        document.getElementById('wins').textContent = wins;
        document.getElementById('losses').textContent = losses;
        document.getElementById('draws').textContent = draws;
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      wins = losses = draws = 0;
      document.getElementById('wins').textContent = '0';
      document.getElementById('losses').textContent = '0';
      document.getElementById('draws').textContent = '0';
      document.getElementById('user-choice').textContent = '-';
      document.getElementById('computer-choice').textContent = '-';
      document.getElementById('result').textContent = '-';
    });
  </script>
</body>
</html>
